<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Posts</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a2027; --muted: #667085;
    --border: #e4e7ec; --accent: #2563eb;
    --open: #2563eb; --applied: #7c3aed; --in-progress: #b45309; --denied: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101418; --card: #181d23; --text: #e6e9ee; --muted: #98a2b3;
      --border: #2a323c; --accent: #60a5fa;
      --open: #60a5fa; --applied: #a78bfa; --in-progress: #f59e0b; --denied: #f97066;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .bar input[type=password] { flex: 1 1 260px; min-width: 220px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); }
  .bar select, .bar button { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); cursor: pointer; }
  .counts { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .counts b { color: var(--text); }
  .country { margin: 26px 0 8px; font-size: 16px; text-transform: capitalize; }
  .tablebox { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; min-width: 640px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  tr:last-child td { border-bottom: none; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .match { font-variant-numeric: tabular-nums; font-weight: 600; }
  select.status { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); font-weight: 600; cursor: pointer; }
  select.status.open { color: var(--open); }
  select.status.applied { color: var(--applied); }
  select.status.in-progress { color: var(--in-progress); }
  select.status.denied { color: var(--denied); }
  select.status:disabled { opacity: .5; }
  #msg { margin: 10px 0; font-size: 13px; min-height: 18px; }
  #msg.err { color: var(--denied); }
  #msg.ok { color: var(--muted); }
  .empty { color: var(--muted); padding: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Job posts</h1>
  <p class="sub" id="repoline">Loading…</p>
  <div class="bar">
    <input id="token" type="password" autocomplete="off"
           placeholder="GitHub token (fine-grained PAT, contents read/write) — needed to change status">
    <select id="filter">
      <option value="">All statuses</option>
      <option value="open">open</option>
      <option value="applied">applied</option>
      <option value="in-progress">in-progress</option>
      <option value="denied">denied</option>
    </select>
    <button id="reload">Reload</button>
  </div>
  <div class="counts" id="counts"></div>
  <div id="msg"></div>
  <div id="app"></div>
</div>

<script>
(() => {
  const STATUSES = ["open", "applied", "in-progress", "denied"];
  // Owner/repo auto-detected when served from *.github.io/<repo>/ ; fallbacks below.
  const FALLBACK = { owner: "miroljub1995", repo: "job-posts" };
  const gh = (() => {
    const h = location.hostname, p = location.pathname.split("/").filter(Boolean);
    if (h.endsWith(".github.io") && p.length) return { owner: h.split(".")[0], repo: p[0] };
    return FALLBACK;
  })();
  const API = `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents`;

  const $ = id => document.getElementById(id);
  const tokenInput = $("token");
  tokenInput.value = localStorage.getItem("gh_token") || "";
  tokenInput.addEventListener("change", () => localStorage.setItem("gh_token", tokenInput.value.trim()));
  $("repoline").textContent = `${gh.owner}/${gh.repo} — status changes are committed straight to main`;

  const headers = () => {
    const h = { Accept: "application/vnd.github+json" };
    const t = tokenInput.value.trim();
    if (t) h.Authorization = `Bearer ${t}`;
    return h;
  };
  const msg = (text, cls) => { const m = $("msg"); m.textContent = text; m.className = cls || ""; };

  // countries: { name, path, sha, jobs }
  let countries = [];

  const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));
  const b64encode = s => { const b = new TextEncoder().encode(s); let out = ""; b.forEach(c => out += String.fromCharCode(c)); return btoa(out); };

  async function api(path, opts) {
    const r = await fetch(`${API}/${path}`, { headers: headers(), ...opts });
    if (!r.ok) throw new Error(`${r.status} ${r.statusText} on ${path}`);
    return r.json();
  }

  async function load() {
    msg("Loading…");
    try {
      const dirs = (await api("jobs")).filter(e => e.type === "dir");
      countries = await Promise.all(dirs.map(async d => {
        const f = await api(`jobs/${d.name}/jobs.json`);
        return { name: d.name, path: f.path, sha: f.sha, jobs: JSON.parse(b64decode(f.content)) };
      }));
      msg("");
      render();
    } catch (e) {
      msg(`Failed to load: ${e.message}. For a private repo, enter a token and reload.`, "err");
    }
  }

  function render() {
    const filter = $("filter").value;
    const totals = {};
    let html = "";
    for (const c of countries) {
      const rows = c.jobs
        .map((job, i) => ({ job, i }))
        .filter(({ job }) => !filter || job.status === filter);
      html += `<h2 class="country">${c.name} <span style="color:var(--muted);font-size:13px">(${c.jobs.length})</span></h2>`;
      html += `<div class="tablebox"><table><thead><tr>
        <th>Post</th><th>Company</th><th>Match&nbsp;%</th><th>Status</th></tr></thead><tbody>`;
      if (!rows.length) html += `<tr><td colspan="4" class="empty">No jobs${filter ? ` with status “${filter}”` : ""}.</td></tr>`;
      for (const { job, i } of rows) {
        totals[job.status] = (totals[job.status] || 0) + 1;
        const title = job.title ? escapeHtml(job.title) : job.url;
        html += `<tr>
          <td><a href="${escapeHtml(job.url)}" target="_blank" rel="noopener">${title}</a></td>
          <td>${escapeHtml(job.company || "")}</td>
          <td class="match">${job.match ?? ""}</td>
          <td><select class="status ${job.status}" data-country="${c.name}" data-index="${i}">
            ${STATUSES.map(s => `<option value="${s}" ${s === job.status ? "selected" : ""}>${s}</option>`).join("")}
          </select></td></tr>`;
      }
      html += `</tbody></table></div>`;
    }
    $("app").innerHTML = html;
    $("counts").innerHTML = STATUSES.map(s => `${s}: <b>${totals[s] || 0}</b>`).join(" · ");
    document.querySelectorAll("select.status").forEach(sel => sel.addEventListener("change", onStatusChange));
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function onStatusChange(ev) {
    const sel = ev.target;
    const country = countries.find(c => c.name === sel.dataset.country);
    const job = country.jobs[Number(sel.dataset.index)];
    const prev = job.status, next = sel.value;
    if (!tokenInput.value.trim()) {
      sel.value = prev;
      msg("Enter a GitHub token above to save status changes.", "err");
      return;
    }
    sel.disabled = true;
    job.status = next;
    try {
      const body = {
        message: `status: ${job.company || "job"} → ${next} (${country.name})`,
        content: b64encode(JSON.stringify(country.jobs, null, 2) + "\n"),
        sha: country.sha,
      };
      const res = await api(country.path, { method: "PUT", body: JSON.stringify(body) });
      country.sha = res.content.sha;
      msg(`Saved: ${job.company || job.url} → ${next}`, "ok");
      render();
    } catch (e) {
      job.status = prev;
      sel.disabled = false;
      sel.value = prev;
      if (/409|422/.test(e.message)) {
        msg("Conflict: the file changed on GitHub. Reloading…", "err");
        load();
      } else {
        msg(`Failed to save: ${e.message}`, "err");
      }
    }
  }

  $("reload").addEventListener("click", load);
  $("filter").addEventListener("change", render);
  load();
})();
</script>
</body>
</html>
